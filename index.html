html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none}

<body>

    <div class="cells" id="cells"></div>

    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="loading" id="generationError" hidden role="alert">
      <p>問題を作れませんでした。</p>

</div>

<p class="hint" id="instructions">1 から指でなぞって、すべてのマスを1回ずつ通り、いちばん大きい数字で終わる。数字は「何番目に通るか」。</p>

<script>
// ---------- seeded RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

// ---------- generator (port of gen/path.py) ----------
function neighbors(r,c,R,C){const o=[];if(r+1<R)o.push([r+1,c]);if(r>0)o.push([r-1,c]);if(c+1<C)o.push([r,c+1]);if(c>0)o.push([r,c-1]);return o}
function randomHamiltonianPath(R,C,rnd){
  let path=[];for(let r=0;r<R;r++){const cols=[];for(let c=0;c<C;c++)cols.push(c);if(r%2)cols.reverse();for(const c of cols)path.push([r,c])}
  const n=path.length,iters=n*n*4;
  for(let it=0;it<iters;it++){
    if(rnd()<0.5)path.reverse();
    const end=path[n-1],prev=path[n-2];
    const cand=neighbors(end[0],end[1],R,C).filter(q=>!(q[0]===prev[0]&&q[1]===prev[1]));
    if(!cand.length)continue;
    const q=cand[Math.floor(rnd()*cand.length)];
    const i=path.findIndex(p=>p[0]===q[0]&&p[1]===q[1]);
    const tail=path.splice(i+1);tail.reverse();path=path.concat(tail);
  }
  if(rnd()<0.5)path.reverse();
  return path;
}
// clues: Map key "r,c" -> k (1-based)
function countSolutions(R,C,clues,limit=2){
  const N=R*C;const posOf=new Map();const grid=new Map();
  for(const [key,k] of clues){posOf.set(k,key.split(',').map(Number));grid.set(key,k)}
  const start=posOf.get(1),end=posOf.get(N);if(!start||!end)return 0;
  const nums=[...posOf.keys()].sort((a,b)=>a-b);
  const nextClue=k=>{let lo=0,hi=nums.length;while(lo<hi){const m=(lo+hi)>>1;if(nums[m]<=k)lo=m+1;else hi=m}return lo<nums.length?nums[lo]:null};
  const vis=Array.from({length:R},()=>new Array(C).fill(false));let found=0;
  function deadEnd(r,c,k){
    for(let rr=0;rr<R;rr++)for(let cc=0;cc<C;cc++){
      if(vis[rr][cc])continue;let deg=0,adj=false;
      for(const [nr,nc] of neighbors(rr,cc,R,C)){if(nr===r&&nc===c)adj=true;else if(!vis[nr][nc])deg++}
      if(deg===0){if(!(adj&&k+1===N&&rr===end[0]&&cc===end[1]))return true}
      else if(deg===1&&!adj&&!(rr===end[0]&&cc===end[1]))return true;
    }return false;
  }
  function dfs(r,c,k){
    if(found>=limit)return;
    if(k===N){found++;return}
    if(N-k>2&&deadEnd(r,c,k))return;
    const nk=nextClue(k);
    if(nk!==null){const [tr,tc]=posOf.get(nk);const d=Math.abs(tr-r)+Math.abs(tc-c),rem=nk-k;if(d>rem||((rem-d)&1))return}
    for(const [nr,nc] of neighbors(r,c,R,C)){
      if(vis[nr][nc])continue;const g=grid.get(nr+','+nc);
      if(g!==undefined&&g!==k+1)continue;
      if(g===undefined&&nk!==null&&k+1===nk)continue;
      vis[nr][nc]=true;dfs(nr,nc,k+1);vis[nr][nc]=false;
    }
  }
  vis[start[0]][start[1]]=true;dfs(start[0],start[1],1);return found;
}
function makePuzzle(R,C,difficulty,rnd){
  const path=randomHamiltonianPath(R,C,rnd),N=path.length;
  const key=p=>p[0]+','+p[1];
  const clues=new Map([[key(path[0]),1],[key(path[N-1]),N]]);
  const pool=shuffle([...Array(N-2).keys()].map(i=>i+1),rnd);
  while(countSolutions(R,C,clues)!==1){if(!pool.length)break;const i=pool.pop();clues.set(key(path[i]),i+1)}
  const removable=shuffle([...clues.keys()].filter(k=>clues.get(k)!==1&&clues.get(k)!==N),rnd);
  for(const k of removable){const v=clues.get(k);clues.delete(k);if(countSolutions(R,C,clues)!==1)clues.set(k,v)}
  const extra={easy:Math.max(2,Math.floor(N/6)),medium:Math.max(1,Math.floor(N/12)),hard:0}[difficulty];
  const cand=shuffle(path.filter(p=>!clues.has(key(p))),rnd);
  for(const p of cand.slice(0,extra))clues.set(key(p),path.findIndex(q=>q[0]===p[0]&&q[1]===p[1])+1);
  return {R,C,path,clues,difficulty};
}

// ---------- worker: 8×8 は数秒かかるので別スレッドで生成 ----------
const GENERATION_TIMEOUT_MS=20000;
let generationJob=null;
function cancelGeneration(){generationJob?.cancel()}
function genAsync(R,C,diff,sd){
  return new Promise((resolve,reject)=>{
    let worker=null,url=null,timer=null,settled=false;
    const complete=(error,p)=>{
      if(settled)return;settled=true;
      clearTimeout(timer);worker?.terminate();if(url)URL.revokeObjectURL(url);
      if(generationJob===job)generationJob=null;
      error?reject(error):resolve(p);
    };
    const job={cancel:()=>complete(new Error('generation cancelled'))};
    generationJob=job;
    try{
      const code=[mulberry32,shuffle,neighbors,randomHamiltonianPath,countSolutions,makePuzzle].map(f=>f.toString()).join('\n')+
        '\nonmessage=e=>{const {R,C,diff,sd}=e.data;postMessage(makePuzzle(R,C,diff,mulberry32(sd)))}';
      url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
      worker=new Worker(url);
      worker.onmessage=e=>{
        const p=e.data;
        if(!p||p.R!==R||p.C!==C||!Array.isArray(p.path)||p.path.length!==R*C||!(p.clues instanceof Map)){
          complete(new Error('invalid generation result'));return;
        }
        complete(null,p);
      };
      worker.onerror=e=>{e.preventDefault();complete(new Error('worker error'))};
      worker.onmessageerror=()=>complete(new Error('worker message error'));
      timer=setTimeout(()=>complete(new Error('generation timeout')),GENERATION_TIMEOUT_MS);
      worker.postMessage({R,C,diff,sd});
    }catch(error){complete(error)}
  });
}
const TUTORIAL={R:4,C:4,difficulty:'easy',
  path:[[0,0],[0,1],[0,2],[0,3],[1,3],[1,2],[1,1],[1,0],[2,0],[2,1],[2,2],[2,3],[3,3],[3,2],[3,1],[3,0]],
  clues:new Map([['0,0',1],['3,0',16],['1,1',7],['2,2',11]])};

// ---------- audio (WebAudio synth, no files) ----------
const SFX={ctx:null,on:true,master:null,
  init(){if(this.ctx)return;try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=0.35;this.master.connect(this.ctx.destination)}catch(e){}},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  tone(freq,{type='triangle',dur=0.22,vol=1,delay=0,detune=0,glide=0}={}){
    if(!this.on||!this.ctx)return;const t=this.ctx.currentTime+delay;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.detune.value=detune;
    if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.02);
  },
  // 1手目 C3 から最後の手で C7 に届くよう、4オクターブを N-1 等分してリセットせず上がり続ける
  total:36,
  freq(i){const n=Math.max(2,this.total);return 130.81*Math.pow(2,4*i/(n-1))},
  step(i){const f=this.freq(i);this.tone(f,{type:'triangle',dur:0.2,vol:0.9});this.tone(f*2,{type:'sine',dur:0.12,vol:0.18})},
  hit(i){this.step(i);const f=this.freq(i)*1.5;this.tone(f,{type:'sine',dur:0.5,vol:0.35,delay:0.02});this.tone(f*2,{type:'sine',dur:0.4,vol:0.1,delay:0.05})},
  back(i){this.tone(this.freq(Math.max(0,i))*0.5,{type:'sine',dur:0.14,vol:0.4})},
  bad(){this.tone(130,{type:'square',dur:0.13,vol:0.25,glide:70});this.tone(98,{type:'triangle',dur:0.18,vol:0.3,glide:60})},
  start(){this.tone(523.25,{type:'sine',dur:0.12,vol:0.3});this.tone(783.99,{type:'sine',dur:0.18,vol:0.25,delay:0.07})},
  clear(){const chord=[523.25,659.25,783.99,1046.5,1318.5];chord.forEach((f,i)=>{this.tone(f,{type:'triangle',dur:0.6,vol:0.6,delay:i*0.07});this.tone(f*2,{type:'sine',dur:0.5,vol:0.15,delay:i*0.07})});
    this.tone(2093,{type:'sine',dur:1.2,vol:0.2,delay:0.4})},
};
function buzz(ms){try{navigator.vibrate?.(ms)}catch(e){}}

// ---------- voice: 日本語で数える ----------
const VOICE={on:true,voices:[],
  init(){if(!('speechSynthesis' in window))return;const load=()=>{this.voices=speechSynthesis.getVoices()};load();speechSynthesis.onvoiceschanged=load},
  pick(lang){const v=this.voices;return v.find(x=>x.lang===lang)||v.find(x=>x.lang.startsWith(lang.slice(0,2)))||null},
  say(n){
    const lang='ja-JP';$('langtag').textContent='';
    if(!this.on||!('speechSynthesis' in window))return;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(n));u.lang=lang;const v=this.pick(lang);if(v)u.voice=v;u.rate=1.15;u.pitch=1.05;u.volume=0.9;speechSynthesis.speak(u)}catch(e){}
  },
  stop(){try{speechSynthesis.cancel()}catch(e){}$('langtag').textContent=''}
};

let unlocked=false;
function unlockAudio(){
  SFX.init();SFX.resume();
  try{const ctx=SFX.ctx;if(ctx){const b=ctx.createBuffer(1,1,22050),src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);src.start(0)}}catch(e){}
  try{if('speechSynthesis' in window&&!unlocked){VOICE.init();const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}
  if(SFX.ctx&&SFX.ctx.state==='running'){unlocked=true;for(const ev of ['touchend','click','keydown'])document.removeEventListener(ev,unlockAudio,true)}
}
for(const ev of ['touchend','click','keydown'])document.addEventListener(ev,unlockAudio,true);

// ---------- fx (confetti on canvas) ----------
const FX={cv:null,cx:null,parts:[],raf:0,
  burst(n=90){
    this.cv=this.cv||$('fx');const r=this.cv.getBoundingClientRect();this.cv.width=r.width*devicePixelRatio;this.cv.height=r.height*devicePixelRatio;
    this.cx=this.cv.getContext('2d');this.cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    const cs=getComputedStyle(document.documentElement);const cols=['--acc','--acc2','--acc3','--ok'].map(v=>cs.getPropertyValue(v).trim());
    for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-0.5)*1.6;const sp=5+Math.random()*7;
      this.parts.push({x:r.width/2,y:r.height*0.55,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.22,w:4+Math.random()*5,h:6+Math.random()*8,rot:Math.random()*6.3,vr:(Math.random()-0.5)*0.3,c:cols[i%cols.length],life:1})}
    if(!this.raf)this.tick();
  },
  tick(){this.raf=requestAnimationFrame(()=>this.tick());const c=this.cx,r=this.cv.getBoundingClientRect();c.clearRect(0,0,r.width,r.height);
    this.parts=this.parts.filter(p=>p.life>0);
    for(const p of this.parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=0.985;p.rot+=p.vr;p.life-=0.011;
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()}
    if(!this.parts.length){cancelAnimationFrame(this.raf);this.raf=0;c.clearRect(0,0,r.width,r.height)}
  }
};

const LABEL={easy:'やさしい',medium:'ふつう',hard:'むずかしい',daily:'きょうの1問',oni:'鬼',tutorial:'れんしゅう'};

function todayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1500)}

let genToken=0;
function newGame(m,forcedSeed){
  mode=m;const tok=++genToken;
  cancelGeneration();endGesture();
  seed=forcedSeed!==undefined?forcedSeed:(m==='daily'?todayKey():(Date.now()^Math.floor(Math.random()*1e9))>>>0);
  const [R,C]=SIZES[m];
  puz=null;route=[];finished=false;finalMs=null;drawing=false;activePointer=null;lastPointer=null;mistakes=0;hintsLeft=HINTS;hintsUsed=0;VOICE.stop();
  if(!(forcedSeed!==undefined&&rival&&rival.seed===seed))rival=null;
  $('challenge').hidden=!rival;if(rival)$('challenge').innerHTML=`⚔️ 対戦中：相手のタイム <strong>${fmt(rival.ms)}</strong> を超えろ`;
  $('done').hidden=true;$('done').classList.remove('in');
  $('generationError').hidden=true;$('cells').replaceChildren();$('svg').replaceChildren();$('coach')?.remove();
  fitBoard();
  for(const b of document.querySelectorAll('.tab'))b.setAttribute('aria-selected',String(b.dataset.mode===m));
  const best=store.get('best:'+m);$('best').hidden=best===null||m==='tutorial';if(best!==null)$('best').textContent='ベスト '+fmt(best);
  clearInterval(timerId);t0=0;$('timer').textContent='0:00';
  syncHint();updateStreak();
  const diff=m==='daily'?'medium':m==='oni'?'hard':m;
  const apply=p=>{if(tok!==genToken)return;puz=p;SFX.total=R*C;$('loading').hidden=true;render();coach();syncHint()};
  if(m==='tutorial'){coachStep=0;apply(TUTORIAL);return Promise.resolve()}
  if(m==='oni'){
    $('loading').hidden=false;
    return genAsync(R,C,diff,seed).then(apply).catch(()=>{
      if(tok!==genToken)return;
      $('loading').hidden=true;$('generationError').hidden=false;syncHint();
    });
  }
  $('loading').hidden=true;apply(makePuzzle(R,C,diff,mulberry32(seed)));return Promise.resolve();
}
function syncHint(){$('hintLeft').textContent=hintsLeft;$('hint').disabled=!puz||hintsLeft<=0||mode==='tutorial'}
function useHint(){
  if(finished||!puz||hintsLeft<=0)return;
  const sol=puz.path;
  let ok=0;while(ok<route.length&&route[ok][0]===sol[ok][0]&&route[ok][1]===sol[ok][1])ok++;
  const cells=$('cells').children;
  for(const d of cells)d.classList.remove('glow','wrong');
  if(ok<route.length){
    route=route.slice(0,ok);drawRoute();toast(`${ok}マス目までは正解。そこから違う道です`);
    const lastOk=route[route.length-1];if(lastOk)cells[lastOk[0]*puz.C+lastOk[1]].classList.add('wrong');
  }else{
    const nx=sol[route.length];if(!nx)return;
    const d=cells[nx[0]*puz.C+nx[1]];d.classList.add('glow');d.addEventListener('animationend',()=>d.classList.remove('glow'),{once:true});
    toast(`${route.length+1}番目はここ`);
  }
  hintsLeft--;hintsUsed++;syncHint();SFX.init();SFX.tone(1318.5,{type:'sine',dur:0.35,vol:0.4});
  if(!t0)startTimer();
}
const COACH=[
  'まず <b>1</b> のマスに指をおいてね',
  'そのまま右へなぞって、上の段を進もう。<b>7</b> は7番目に通るマス',
  'いいね！ <b>11</b> を11番目に通るように下の段へ',
  '最後は <b>16</b> で終わり。全部のマスを1回ずつ通れたらクリア！'
];
function coach(){
  let el=document.getElementById('coach');
  if(mode!=='tutorial'||finished){el?.remove();return}
  if(!el){el=document.createElement('div');el.id='coach';el.className='coach';$('board').appendChild(el)}
  const n=route.length;coachStep=n===0?0:n<7?1:n<11?2:3;
  el.innerHTML=COACH[coachStep];
}
function startTimer(){if(t0)return;t0=Date.now();timerId=setInterval(()=>{$('timer').textContent=fmt(Date.now()-t0)},500)}

function fitBoard(){
  // 常に横幅いっぱい（上限560px）。高さが足りなければページをスクロールさせる。縮めてマスを小さくすることはしない
  const wrap=document.querySelector('.boardwrap'),b=$('board');
  const size=Math.min(wrap.clientWidth,560);
  b.style.width=size+'px';b.style.height=size+'px';
  const hint=$('instructions');hint.classList.toggle('compact',window.innerHeight<720);
}
function render(){
  const {R,C,clues}=puz;const cells=$('cells');cells.style.gridTemplateColumns=`repeat(${C},minmax(0,1fr))`;cells.style.gridTemplateRows=`repeat(${R},minmax(0,1fr))`;cells.innerHTML='';
  fitBoard();
  const fs=Math.max(14,Math.floor(($('board').clientWidth||360)/C*0.42));
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const d=document.createElement('div');d.className='c';d.dataset.r=r;d.dataset.c=c;d.style.fontSize=fs+'px';
    const k=clues.get(r+','+c);if(k){const s=document.createElement('span');s.className='n';s.textContent=k;d.appendChild(s)}
    cells.appendChild(d);
  }
  drawRoute();
}
function drawRoute(opts={}){
  const {R,C}=puz;const svg=$('svg');
  const pts=route.map(([r,c])=>[(c+0.5)*100/C,(r+0.5)*100/R]);
  const w=Math.max(2.5,100/C*0.34);
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#e8553a';
  let html='';
  if(pts.length>1)html+=`<polyline class="${opts.draw?'draw':''}" points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${acc};stroke-width:${w};stroke-linecap:round;stroke-linejoin:round"/>`;
  if(pts.length){const [hx,hy]=pts[pts.length-1];html+=`<circle class="head" cx="${hx}" cy="${hy}" r="${w*0.62}" style="fill:${acc}"/>`}
  svg.innerHTML=html;
  const order=new Map(route.map(([r,c],i)=>[r+','+c,i+1]));const headKey=route.length?route[route.length-1].join(','):null;
  for(const d of $('cells').children){const key=d.dataset.r+','+d.dataset.c;const i=order.get(key);
    d.classList.toggle('vis',i!==undefined);d.classList.toggle('head',key===headKey);
    let k=d.querySelector('.k');
    if(i!==undefined&&!puz.clues.has(key)){if(!k){k=document.createElement('span');k.className='k';d.appendChild(k)}k.textContent=i}
    else if(k)k.remove();}
  $('count').textContent=`${route.length}/${R*C}`;
  if(mode==='tutorial')coach();
}
function cellAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('.c')}
function tryStep(r,c){
  if(finished||!puz)return;
  const last=route[route.length-1];
  if(!last){ if(puz.clues.get(r+','+c)===1){route.push([r,c]);startTimer();drawRoute();SFX.start();VOICE.say(1);popCell(r,c,'just');buzz(8)}else{flash(r,c);SFX.bad()};return }
  if(last[0]===r&&last[1]===c)return;
  const prev=route[route.length-2];
  if(prev&&prev[0]===r&&prev[1]===c){route.pop();drawRoute();SFX.back(route.length-1);return}   // backtrack
  if(Math.abs(last[0]-r)+Math.abs(last[1]-c)!==1)return;
  if(route.some(p=>p[0]===r&&p[1]===c)){mistakes++;flash(r,c);SFX.bad();return}
  const k=puz.clues.get(r+','+c),step=route.length+1;
  if(k!==undefined&&k!==step){mistakes++;flash(r,c);SFX.bad();buzz([20,30,20]);toast(`そのマスは ${k} 番目`);return}
  route.push([r,c]);drawRoute();
  const i=route.length-1;
  VOICE.say(i+1);
  if(k!==undefined){SFX.hit(i);popCell(r,c,'hit');buzz(15)}else{SFX.step(i);popCell(r,c,'just');buzz(6)}
  if(route.length===puz.R*puz.C)finish();
}
function popCell(r,c,cls){const d=$('cells').children[r*puz.C+c];d.classList.remove(cls);void d.offsetWidth;d.classList.add(cls);d.addEventListener('animationend',()=>d.classList.remove(cls),{once:true})}
function flash(r,c){const d=$('cells').children[r*puz.C+c];d.classList.remove('bad');void d.offsetWidth;d.classList.add('bad')}
function finish(){
  if(finished||!puz)return;
  finalMs=Math.max(0,Date.now()-t0);finished=true;clearInterval(timerId);
  const ms=finalMs;$('timer').textContent=fmt(ms);
  if(mode!=='tutorial'){const best=store.get('best:'+mode);if(best===null||ms<best){store.set('best:'+mode,ms);$('best').hidden=false;$('best').textContent='ベスト '+fmt(ms)}}
  if(mode==='tutorial')store.set('tut',1);
  document.getElementById('coach')?.remove();
  if(mode==='daily')store.set('daily:'+seed,ms);
  const perfect=(mistakes===0&&hintsUsed===0?'  ✨パーフェクト':`  ミス${mistakes}`)+(hintsUsed?`  💡${hintsUsed}`:'');
  let verdict='';
  if(rival){verdict=ms<rival.ms?`🏆 勝ち！ 相手 ${fmt(rival.ms)}`:ms===rival.ms?`🤝 引き分け ${fmt(rival.ms)}`:`😵 負け… 相手 ${fmt(rival.ms)}`}
  $('doneText').innerHTML=`${LABEL[mode]} ${puz.R}×${puz.C}  ${fmt(ms)}${perfect}`+(verdict?`<br><span class="verdict">${verdict}</span>`:'');
  updateStreak();
  SFX.clear();buzz([30,40,30,40,80]);
  drawRoute({draw:true});
  const cells=$('cells').children;route.forEach(([r,c],i)=>{const d=cells[r*puz.C+c];d.classList.remove('win');d.style.animationDelay=(i*18)+'ms';void d.offsetWidth;d.classList.add('win')});
  setTimeout(()=>FX.burst(110),250);setTimeout(()=>FX.burst(60),650);
  $('next').textContent=mode==='tutorial'?'きょうの1問へ':'つぎの問題';$('dare').hidden=mode==='tutorial';$('copyDare').hidden=mode==='tutorial';
  const dn=$('done');dn.hidden=false;dn.classList.remove('in');void dn.offsetWidth;dn.classList.add('in');
}
function emojiGrid(){
  const rows=[];for(let r=0;r<puz.R;r++){let row='';for(let c=0;c<puz.C;c++)row+=puz.clues.has(r+','+c)?'🟧':'⬜';rows.push(row)}return rows.join('\n');
}
function modeCode(){return {easy:'e',medium:'m',hard:'h',daily:'d',oni:'o'}[mode]}
function challengeLink(ms){return `${SHARE_URL}#c-${modeCode()}-${seed}-${Math.round(ms/1000)}`}
function shareText(withLink){
  const ms=finalMs??(t0?Math.max(0,Date.now()-t0):0);
  const d=mode==='daily'?new Date(Math.floor(seed/10000),Math.floor(seed/100)%100-1,seed%100):new Date();
  const head=mode==='daily'?`ヒトフデ きょうの1問 ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`:`ヒトフデ ${LABEL[mode]} ${puz.R}×${puz.C}`;
  const st=mode==='daily'?`  🔥${streakDays()}日`:'';
  const perfect=(mistakes===0&&hintsUsed===0?' ✨パーフェクト':` ミス${mistakes}`)+(hintsUsed?` 💡${hintsUsed}`:'');
  return `${head}\n⏱ ${fmt(ms)}${perfect}${st}\n${emojiGrid()}\n`+(withLink?`このタイムに挑む → ${challengeLink(ms)}`:SHARE_URL);
}
// ---------- streak / calendar ----------
function dayKey(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function streakDays(){
  let n=0;const d=new Date();
  if(store.get('daily:'+dayKey(d))===null)d.setDate(d.getDate()-1);   // 今日未クリアなら昨日から数える
  while(store.get('daily:'+dayKey(d))!==null){n++;d.setDate(d.getDate()-1)}
  return n;
}
function updateStreak(){
  const n=streakDays();$('streak').textContent=n?`🔥 ${n}日連続`:'';
  renderCalendar();
}
function renderCalendar(){
  const g=$('calgrid');if($('calpanel').hidden)return;
  const now=new Date();const y=now.getFullYear(),m=now.getMonth();
  $('calTitle').textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();
  let html=['日','月','火','水','木','金','土'].map(w=>`<div class="w">${w}</div>`).join('');
  for(let i=0;i<first;i++)html+='<div></div>';
  for(let d=1;d<=days;d++){const k=y*10000+(m+1)*100+d;const done=store.get('daily:'+k)!==null;const today=d===now.getDate();
    html+=`<div class="d${done?' done':''}${today?' today':''}">${d}</div>`}
  g.innerHTML=html;
}
// ---------- input ----------
const board=$('board');
let activePointer=null,lastPointer=null,pageScrollLock=null;
function lockPageScroll(){
  if(pageScrollLock)return;
  const scroller=$('appScroll');
  pageScrollLock={x:scroller.scrollLeft,y:scroller.scrollTop,overflowY:scroller.style.overflowY};
  // The document stays fixed; only this internal surface can scroll between games.
  scroller.style.overflowY='hidden';
}
function endGesture(){
  drawing=false;activePointer=null;lastPointer=null;
  if(!pageScrollLock)return;
  const saved=pageScrollLock;pageScrollLock=null;
  const scroller=$('appScroll');scroller.style.overflowY=saved.overflowY;
  scroller.scrollTo(saved.x,saved.y);
}
function pointerCell(point){
  if(!puz)return null;
  const rect=$('cells').getBoundingClientRect();
  if(point.x<rect.left||point.y<rect.top||point.x>=rect.right||point.y>=rect.bottom)return null;
  return [Math.floor((point.y-rect.top)/rect.height*puz.R),Math.floor((point.x-rect.left)/rect.width*puz.C)];
}
function tracePointer(point){
  const target=pointerCell(point);
  if(!target){lastPointer=null;return}
  const from=lastPointer||point;
  const rect=$('cells').getBoundingClientRect();
  const spacing=Math.min(rect.width/puz.C,rect.height/puz.R)/4;
  const steps=Math.max(1,Math.ceil(Math.hypot(point.x-from.x,point.y-from.y)/spacing));
  // Sample only the actual pointer segment. tryStep still rejects diagonals, revisits and wrong clues.
  let previous=pointerCell(from);
  if(!lastPointer&&previous)tryStep(...previous);
  for(let i=1;i<=steps;i++){
    const cell=pointerCell({x:from.x+(point.x-from.x)*i/steps,y:from.y+(point.y-from.y)*i/steps});
    if(cell&&(!previous||cell[0]!==previous[0]||cell[1]!==previous[1]))tryStep(...cell);
    previous=cell;
  }
  lastPointer=point;
}
board.addEventListener('pointerdown',e=>{
  if(!puz||finished||activePointer!==null||!e.isPrimary||e.button!==0)return;
  const point={x:e.clientX,y:e.clientY};if(!pointerCell(point))return;
  SFX.init();SFX.resume();VOICE.init();drawing=true;activePointer=e.pointerId;lastPointer=null;
  if(e.pointerType==='touch')lockPageScroll();
  if(e.cancelable)e.preventDefault();
  board.setPointerCapture(e.pointerId);tracePointer(point);
});
function movePointer(e){
  if(!drawing||e.pointerId!==activePointer)return;
  if(e.cancelable)e.preventDefault();
  const points=e.getCoalescedEvents?.()||[];
  for(const p of points)tracePointer({x:p.clientX,y:p.clientY});
  tracePointer({x:e.clientX,y:e.clientY});
}
function releasePointer(e){
  if(e.pointerId!==activePointer)return;
  endGesture();
}
// Safari needs an explicitly non-passive touch listener to cancel native panning.
for(const type of ['touchstart','touchmove'])document.addEventListener(type,e=>{
  if(drawing&&e.cancelable)e.preventDefault();
},{passive:false,capture:true});
window.addEventListener('blur',endGesture);
document.addEventListener('visibilitychange',()=>{if(document.hidden)endGesture()});
board.addEventListener('pointermove',movePointer);
board.addEventListener('pointerup',e=>{movePointer(e);releasePointer(e)});
board.addEventListener('pointercancel',releasePointer);
board.addEventListener('lostpointercapture',releasePointer);
$('retryGeneration').onclick=()=>newGame(mode,seed);
$('leaveGeneration').onclick=()=>newGame('medium');
$('undo').onclick=()=>{if(finished||!puz)return;route.pop();drawRoute()};
$('clear').onclick=()=>{if(finished||!puz)return;route=[];drawRoute();VOICE.stop()};
$('new').onclick=()=>newGame(mode==='daily'||mode==='tutorial'?'medium':mode);
$('hint').onclick=useHint;
$('help').onclick=()=>newGame('tutorial');
$('next').onclick=()=>newGame(mode==='tutorial'?'daily':mode==='daily'?'medium':mode);
async function copy(txt,okMsg){
  try{
    if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');
    await navigator.clipboard.writeText(txt);toast(okMsg);
  }catch(e){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{if(document.execCommand('copy'))toast(okMsg);else toast('コピーできませんでした')}
    catch(error){toast('コピーできませんでした')}
    finally{ta.remove()}
  }
}
// Use the system share sheet for a one-tap LINE / Messages invitation.
function challengeShareData(){
  const ms=finalMs??(t0?Math.max(0,Date.now()-t0):0);
  return {
    title:'ヒトフデで対戦！',
    text:`ヒトフデで対戦しよう！\n${LABEL[mode]} ${puz.R}×${puz.C}  私の記録 ${fmt(ms)}\nこのタイムを超えられる？`,
    url:challengeLink(ms)
  };
}
async function shareChallenge(){
  const data=challengeShareData();
  if(typeof navigator.share==='function'){
    try{
      // Must be called before any await to retain the user's click gesture.
      await navigator.share(data);
      return;
    }catch(e){
      if(e?.name==='AbortError')return; // User closed the share sheet.
    }
  }
  await copy(data.url,'対戦リンクをコピーしました');
}
$('dare').onclick=shareChallenge;
$('copyDare').onclick=()=>copy(challengeShareData().url,'対戦リンクをコピーしました');
$('cal').onclick=()=>{const pn=$('calpanel');pn.hidden=!pn.hidden;$('cal').setAttribute('aria-pressed',String(!pn.hidden));renderCalendar()};
$('share').onclick=()=>copy(shareText(false),'コピーしました');
for(const b of document.querySelectorAll('.tab'))b.onclick=()=>newGame(b.dataset.mode);
SFX.on=store.get('sound2')!==false;
const sndBtn=$('snd');function syncSnd(){sndBtn.textContent=SFX.on?'🔊':'🔇';sndBtn.setAttribute('aria-pressed',String(SFX.on))}
sndBtn.onclick=()=>{SFX.on=!SFX.on;store.set('sound2',SFX.on);syncSnd();if(SFX.on){SFX.init();SFX.resume();SFX.step(4)}};syncSnd();
VOICE.on=store.get('voice2')!==false;VOICE.init();
const vBtn=$('voice');function syncV(){vBtn.setAttribute('aria-pressed',String(VOICE.on))}
vBtn.onclick=()=>{VOICE.on=!VOICE.on;store.set('voice2',VOICE.on);syncV();if(VOICE.on)VOICE.say(Math.max(1,route.length))};syncV();
document.fonts?.ready?.then(()=>{if(puz){fitBoard();drawRoute()}});
window.addEventListener('resize',()=>{if(puz){fitBoard();const fs=Math.max(14,Math.floor($('board').clientWidth/puz.C*0.42));for(const d of $('cells').children)d.style.fontSize=fs+'px';drawRoute()}});

// Configure real attribution here; empty fields do not produce placeholder links.
const SITE_CREDITS={name:'',creatorUrl:'',worksUrl:''};
function renderCredits(){
  const footer=$('credits');footer.replaceChildren();
  const link=(label,href)=>{
    if(!href)return;
    try{const url=new URL(href);if(url.protocol!=='https:')return;
      const a=document.createElement('a');a.textContent=label;a.href=url.href;footer.appendChild(a);
    }catch(e){}
  };
  if(SITE_CREDITS.name){const label=document.createElement('span');label.textContent='制作：'+SITE_CREDITS.name;footer.appendChild(label)}
  link('制作者について',SITE_CREDITS.creatorUrl);link('ほかの作品',SITE_CREDITS.worksUrl);
  footer.hidden=!footer.childElementCount;
}
renderCredits();

// ---------- boot (hot-reload aware) ----------
function start(data){
  const m=/^#c-([emhdo])-(\d+)-(\d+)$/.exec(location.hash||'');
  if(m){const md={e:'easy',m:'medium',h:'hard',d:'daily',o:'oni'}[m[1]];rival={seed:+m[2],ms:+m[3]*1000};newGame(md,+m[2]);toast('対戦モード：相手のタイムに挑戦！');return}
  if(data&&data.seed&&data.mode){rival=data.rival||null;newGame(data.mode,data.seed).then(()=>{if(!puz)return;route=data.route||[];if(route.length)startTimer();drawRoute()})}
  else newGame(store.get('tut')?'daily':'tutorial');
}
window.claude?.hot?.snapshot?.(()=>({mode,seed,route,rival}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
