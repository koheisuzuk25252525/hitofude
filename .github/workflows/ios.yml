name: App Store screenshot preparation (1.0 build 6)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Native screenshots - ${{ matrix.family }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    steps:
      - name: Check out preparation tools
        uses: actions/checkout@v4
        with:
          path: preparation
          persist-credentials: false
      - name: Check out the unchanged release candidate
        uses: actions/checkout@v4
        with:
          ref: a04cd41237d4d74b382222aec60ad6c970fda8e2
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture real native Simulator screens
        env:
          CAPTURE_FAMILY: ${{ matrix.family }}
        run: |
          bash preparation/scripts/release-capture/capture.sh \
            "$GITHUB_WORKSPACE/source" "$CAPTURE_FAMILY" "$GITHUB_WORKSPACE/capture-output"
      - name: Verify application source remains unchanged
        if: always()
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = a04cd41237d4d74b382222aec60ad6c970fda8e2
          git diff --exit-code -- ios/Hitofude ios/HitofudeTests ios/Configuration
      - name: Report capture details
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import pathlib
          root = pathlib.Path('capture-output')
          for pattern in ['*dimensions*.json', '*device*.json', '*summary*.json']:
              for path in root.rglob(pattern):
                  message = path.read_text(errors='replace')[:3500]
                  escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=' + path.name + '::' + escaped)
          for path in root.rglob('*.log'):
              lines = path.read_text(errors='replace').splitlines()
              useful = [line for line in lines if 'error:' in line or 'failed' in line.lower() or 'executed' in line.lower()]
              message = '\n'.join(useful[-20:] or lines[-12:])[-3500:]
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=' + path.name + '::' + escaped)
          PYREPORT
      - name: Save screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hitofude-1.0-6-native-${{ matrix.family }}
          path: |
            capture-output/
            !capture-output/DerivedData/**
          if-no-files-found: error
          retention-days: 30
